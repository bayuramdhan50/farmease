version: '3.9'

services:  
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: farmdb
      DB_PORT: 3306
      PORT: 5000
      AWS_REGION: ap-southeast-1
      S3_BUCKET: farmease-storage
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ["npm", "run", "start"]  # pastikan ini ada di package.json

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://13.250.23.218:5000/api
    depends_on:
      - backend
    command: ["npm", "run", "start"]  # pastikan juga ini sesuai dengan Next.js kamu

volumes:
  mysql-data:
